# Reverse proxy for a Hostinger VPS. Drop in /etc/nginx/sites-available/,
# symlink into sites-enabled, then `certbot --nginx -d your-domain.com`
# to attach a certificate (certbot rewrites the listen block for TLS).

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # The Node process serves both the API and the built SPA, so everything
    # goes to one upstream.
    location / {
        proxy_pass         http://127.0.0.1:5061;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # No Upgrade/Connection headers here on purpose. This app speaks plain
        # HTTP — it has no WebSocket route. Forwarding a hard-coded
        # `Connection: upgrade` on ordinary requests makes Nginx hold the
        # connection waiting for a 101 handshake the app never performs, and
        # the wait ends as a 504 once proxy_read_timeout elapses.
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;
}
